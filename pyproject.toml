[project]
name = "promptbench"
version = "0.2.3"
description = "A CLI tool for testing, evaluating, and refining agentic prompts, behaviors, and tool-calling skills."
readme = "README.md"
authors = [{ name = "Buck Brady", email = "22723438+voidrot@users.noreply.github.com" }]
requires-python = ">=3.14"
dependencies = [
  "flask>=3.0.0",
  "pydantic>=2.8.0",
  "pydantic-ai>=0.0.17",
  "pyyaml>=6.0.1",
  "sqlmodel>=0.0.22",
  "typer>=0.12.3",
]

[project.scripts]
promptbench = "promptbench.cli.main:main"

[build-system]
requires = ["uv_build>=0.11.11,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src"]
